<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FG · 脑</title>
<style>
  :root{
    --bg:#04060c; --ink:#e8eef7; --dim:#7c8aa0; --line:#1b2434;
    --file:#4fd1ff; --rule:#ffd166; --action:#b98cff; --trigger:#ff6b8a; --tool:#6ee7a8;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #c.drag{cursor:grabbing}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 35%,rgba(0,0,0,.55) 100%)}
  .panel{position:fixed;background:rgba(9,13,22,.72);border:1px solid var(--line);
    border-radius:10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 32px rgba(0,0,0,.45)}
  /* 左上 · 身份 */
  #head{left:18px;top:18px;padding:13px 16px 12px;min-width:280px}
  #head h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.14em}
  #head h1 span{color:var(--file)}
  #head .sub{margin-top:6px;color:var(--dim);font-size:11.5px;line-height:1.7}
  #head .sub b{color:#c3d0e2;font-weight:500}
  /* 右上 · 图例 */
  #legend{right:18px;top:18px;padding:11px 14px;min-width:186px}
  #legend .t{color:var(--dim);font-size:10.5px;letter-spacing:.12em;margin-bottom:8px}
  #legend .sep{height:1px;background:var(--line);margin:8px 0 6px}
  .lg{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;user-select:none;
    opacity:1;transition:opacity .15s}
  .lg.off{opacity:.3}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
  .lg .n{flex:1;color:#c3d0e2}
  .lg .v{color:var(--dim);font-size:11px}
  /* 右下 · 提示 */
  #hint{right:18px;bottom:18px;padding:9px 13px;color:var(--dim);font-size:11px;line-height:1.8}
  #hint b{color:#a9b8cc;font-weight:500}
  /* 左下 · 详情 */
  #card{left:18px;bottom:18px;width:430px;max-width:calc(100vw - 36px);padding:14px 16px;
    display:none;max-height:52vh;overflow:auto}
  #card.show{display:block}
  #card .k{font-size:10.5px;letter-spacing:.12em;color:var(--dim)}
  #card h2{margin:5px 0 3px;font-size:14px;font-weight:600;word-break:break-all;line-height:1.4}
  #card .m{color:var(--dim);font-size:11px;margin-bottom:10px}
  #card .ev{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:7px 0;
    color:#9fb0c6;font-size:11.5px;line-height:1.65}
  #card .ev.inf{border-left-color:#3d4a63;color:#93a6c2;font-size:11px}
  #card .dim{opacity:.5;font-size:10.5px}
  #card .close{position:absolute;right:12px;top:10px;color:var(--dim);cursor:pointer;font-size:15px;
    line-height:1;padding:3px}
  #card .close:hover{color:var(--ink)}
  /* 底部中间 · 时间轴提示 */
  #foot{left:50%;bottom:18px;transform:translateX(-50%);padding:7px 14px;color:var(--dim);
    font-size:11px;white-space:nowrap}
  #foot b{color:#c3d0e2;font-weight:500}
  #err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:40px;
    color:var(--dim);font-size:13px;line-height:1.9}
  @media (max-width:820px){
    #legend{display:none} #card{width:calc(100vw - 36px)} #foot{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<div id="head" class="panel">
  <h1>FG · <span>脑</span></h1>
  <div class="sub" id="meta"></div>
</div>

<div id="legend" class="panel">
  <div class="t">实体类型（点此过滤）</div>
  <div id="lgs"></div>
  <div class="sep"></div>
  <div id="infRow"></div>
</div>

<div id="card" class="panel">
  <div class="close" id="cardClose">✕</div>
  <div class="k" id="cardKind"></div>
  <h2 id="cardName"></h2>
  <div class="m" id="cardMeta"></div>
  <div id="cardEv"></div>
</div>

<div id="hint" class="panel">
  <b>拖拽</b> 旋转　<b>滚轮</b> 缩放<br>
  <b>点击</b> 实体看详情　<b>空格</b> 暂停自转
</div>

<div id="foot" class="panel"></div>
<div id="err"></div>

<script>
const DATA = /*__FG_BRAIN_DATA__*/null;

/* ══════════════════════════════════════════════════════════════
   判据：位置 = FNV-1a(实体名) → 皮层顶点。
   实体不变，位置就不变。每次刷新乱跳的图，看不出东西在长。
   ══════════════════════════════════════════════════════════════ */
const hash = (s) => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; };
const rng32 = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ── 自有皮层网格 ───────────────────────────────────────────────
   不是解剖模型，是几个解析曲面 + 褶皱。理由：memory-brain 的 cortex/*.bin
   是 CC BY-SA 3.0，不能打包；自己算出来的东西没有许可证问题。

   比例按真实人脑取：前后长 167mm / 左右宽 140mm / 上下高 93mm
   → 大脑 x:y:z = 0.84 : 0.56 : 1.00。**宽度永远大于高度**，这是硬约束。

   上一版为了"凑"侧面剪影的高度，把 y 拉到 0.96（x 只有 0.78），
   于是脑子比宽还高——竖着的鸡蛋。错在**把高度算在大脑头上**：
   真实侧面轮廓之所以接近 1.3:1，是因为脑干垂在大脑下面，不是大脑本身高。
   剪影该由"大脑 + 下垂的脑干"共同给出，不能拿大脑去补。 */
const NC = 62000, NB = 9000, NS = 4500, NPTS = NC + NB + NS;

function fib(i, n) {
  const y = 1 - (i / (n - 1)) * 2;
  const r = Math.sqrt(Math.max(0, 1 - y * y));
  const th = i * 2.399963229728653;
  return [Math.cos(th) * r, y, Math.sin(th) * r];
}

const smooth01 = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

/* 半轴。前后长 : 左右宽 : 上下高 = 1.00 : 0.84 : 0.56（真实人脑 167:140:93）。
   三个半轴支持 URL 覆盖（?ax=&ay=&az=），供视觉门控做参数搜索。
   注意：门控只能验"剪影吻合"，验不了"这是不是脑子"——上一轮就是照着
   一张 AI 生成的参考图把 y 拉到 0.96，IoU 涨了，东西更丑了。
   参考图本身也要被怀疑。 */
const Q = new URLSearchParams(location.search);
const AX = +(Q.get("ax") || 0.84), AY = +(Q.get("ay") || 0.56), AZ = +(Q.get("az") || 1.0);
const AXIS2 = [AX * AX, AY * AY, AZ * AZ];

/* 光从上前右来。lambert 只跟法线有关、跟视角无关，所以**在 CPU 上烘进顶点色**：
   每帧省掉 5 万个顶点上的 dot + normalize。真正需要每帧算的只剩深度测试本身。
   "让显卡硬算"的反面不是少画点，是**把跟视角无关的东西提前算完**。 */
const LD = (() => { const v = [0.42, 0.76, 0.50], l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; })();
function lamAt(nx, ny, nz) {
  const l = Math.hypot(nx, ny, nz) || 1;
  return Math.max(0, (nx * LD[0] + ny * LD[1] + nz * LD[2]) / l);
}

/* 三维值噪声。
   之前用"四组正弦叠加"当沟回，问题是**正弦有主方向**：叠加几条就出几套平行长脊，
   整个脑子像一条切了花刀的面包。真实沟回是各向同性的迷宫，没有主方向。
   值噪声在立方格点上取随机值再平滑插值，天生各向同性，叠三个倍频就有细节层次。 */
const PERM = (() => {
  const r = rng32(0x5BF03635), a = new Uint8Array(512);
  for (let i = 0; i < 256; i++) a[i] = i;
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
  for (let i = 0; i < 256; i++) a[i + 256] = a[i];
  return a;
})();
const fade5 = (t) => t * t * (3 - 2 * t);
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const u = fade5(x - xi), v = fade5(y - yi), w = fade5(z - zi);
  const h = (a, b, c) => PERM[(PERM[(PERM[a & 255] + (b & 255)) & 255] + (c & 255)) & 255] / 255;
  const c000 = h(xi, yi, zi), c100 = h(xi + 1, yi, zi);
  const c010 = h(xi, yi + 1, zi), c110 = h(xi + 1, yi + 1, zi);
  const c001 = h(xi, yi, zi + 1), c101 = h(xi + 1, yi, zi + 1);
  const c011 = h(xi, yi + 1, zi + 1), c111 = h(xi + 1, yi + 1, zi + 1);
  const x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u;
  const x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
  const y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
  return y0 + (y1 - y0) * w;
}

function buildMesh() {
  const pos = new Float32Array(NPTS * 3);
  const col = new Float32Array(NPTS * 3);
  const siz = new Float32Array(NPTS);
  /* 每个点自带一个**朝外法线**。实体要贴到皮层表面外侧才不会被深度测试埋掉，
     靠 normalize(坐标) 反推是错的（脑干离原点很远，会被推成竖直方向）。 */
  const nrm = new Float32Array(NPTS * 3);
  const rnd = rng32(0x9E3779B9);
  const TAU = Math.PI * 2;
  let p = 0;

  // 大脑：椭球 + 纵裂 + 脑回褶皱
  for (let i = 0; i < NC; i++) {
    let [x, y, z] = fib(i, NC);
    /* 抖动只往**切向**加：加完再归一化，径向那部分被吃掉。
       上一版是三轴纯随机抖动，径向分量留在里面，fib 的螺旋被椭球缩放后
       显成一圈圈同心环——俯视像洋葱，侧看像水波纹。 */
    x += (rnd() - 0.5) * 0.034; y += (rnd() - 0.5) * 0.034; z += (rnd() - 0.5) * 0.034;
    const il = 1 / (Math.hypot(x, y, z) || 1);
    x *= il; y *= il; z *= il;

    /* 沟回：值噪声给的是**块**，而脑沟是**窄线**。
       直接拿噪声当高度，明暗出来是一块块黑斑（像石头上的苔痕）；
       真实沟回是"宽的圆顶 + 窄的深沟"——沟只占表面很小一条。
       做法：不取噪声值本身，取它**等值线**附近的一个窄带（n≈0.5 的等高线），
       那是一条条细曲线，正好当沟底。 */
    const n1 = vnoise(x * 6.0, y * 6.0, z * 6.0);
    const n2 = vnoise(x * 12.0 + 3.1, y * 12.0 + 1.7, z * 12.0 + 5.3);

    /* 几何只做轻微起伏：幅度必须小。大了会把点云撑出缝，露出背景，
       就成了"黑洞"——那是几何位移的锅，不是明暗的锅。 */
    let w = 0.020 * (n1 - 0.5) + 0.008 * (n2 - 0.5);

    /* 外侧裂（Sylvian fissure）：侧面最好认的一条沟，从前下走向后上，
       把颞叶和额顶叶分开。没有它，侧脸就是个椭圆。 */
    const zs = smooth01(-0.30, 0.10, z) * smooth01(1.00, 0.40, z);
    const ys = -0.36 + 0.26 * (z + 0.30);
    const syl = zs * Math.exp(-Math.pow((y - ys) / 0.055, 2));
    w -= 0.020 * syl;

    const r = 1 + w;
    x *= r * AX; y *= r * AY; z *= r * AZ;

    /* 顶点略平、两极略收：真脑的顶不是圆弧，额极和枕极都比中间窄。
       再给一点前后不对称：枕侧（z<0）略高、额侧略低。完全对称的椭圆
       一眼就是"画的"，人脑侧脸永远是歪的。 */
    y *= 1 - 0.115 * smooth01(0.10, 1.0, y) * (1 - Math.abs(z) * 0.55);
    y += 0.050 * (1 - smooth01(-1.0, 0.45, z));

    /* 颞叶：前下方垂下来的一块。
       这是侧脸最重要的形状线索——真实脑的**底缘不是椭圆弧**：
       额叶底 → 颞极下垂 → 颞叶底面 → 枕前切迹上收 → 小脑。
       少了这一块，再好的沟回也只是一颗有花纹的蛋。 */
    const tp = Math.exp(-Math.pow((z - 0.16) / 0.44, 2)) * Math.exp(-Math.pow((y + 0.30) / 0.26, 2));
    y -= 0.155 * tp;
    x *= 1 + 0.085 * tp;

    // 枕极略平、颞叶外鼓（前后上下不对称才是脑子）
    z += 0.040 * smooth01(0.2, 1.0, z) * (1 - Math.abs(y));
    const tl = Math.exp(-Math.pow((y + 0.22) / 0.24, 2)) * Math.exp(-Math.pow((z - 0.06) / 0.52, 2));
    x *= 1 + 0.060 * tl;

    /* 纵裂：**窄、浅、不到底**。
       旧版是把 |x|<0.15 的点整体外推 0.125，等于把两个半球掰开——
       那是东非大裂谷，不是纵裂。真实纵裂宽约 3mm（相对脑宽 0.02），
       深约半球高的 1/3，底面由胼胝体连着，沟到不了底。 */
    const up = smooth01(-0.14, 0.28, y);          // 越往上越深，下半部合拢
    x += Math.sign(x || 1) * 0.026 * Math.exp(-Math.pow(x / 0.036, 2)) * up;

    /* 底面**不裁**。
       上一版为了"颅底是平的"按截面半径裁切，结果极点附近的 rr→0，
       `cut/rr` 直接顶到上限 2.2——底部被撑出一圈 2.2 倍半径的裙边，
       侧看是一张飞碟，把小脑和脑干全盖住了。
       真实颅底不是平盘：是颞叶下缘 + 小脑 + 脑干凑出来的。让它们自己凑。 */

    /* 明暗一次烘进去：lambert（光）+ 沟回。
       沟 = 噪声等值线附近的窄带，宽度用高斯控制（0.05 是带宽），
       两个倍频各一层，粗沟 + 细沟。外侧裂再单独压一道更深的。
       这样"沟"是一条条线，不是一块块斑——线才是沟回，斑只是脏。 */
    const sul = 0.70 * Math.exp(-Math.pow((n1 - 0.5) / 0.050, 2))
              + 0.30 * Math.exp(-Math.pow((n2 - 0.5) / 0.045, 2))
              + 0.55 * syl;
    const cav = 1 - Math.min(0.90, sul);
    const nx = x / AXIS2[0], ny = y / AXIS2[1], nz = z / AXIS2[2];
    const nl = Math.hypot(nx, ny, nz) || 1;
    const k = (0.15 + 1.00 * lamAt(nx, ny, nz)) * cav * (0.86 + 0.20 * rnd());
    pos[p * 3] = x; pos[p * 3 + 1] = y; pos[p * 3 + 2] = z;
    nrm[p * 3] = nx / nl; nrm[p * 3 + 1] = ny / nl; nrm[p * 3 + 2] = nz / nl;
    col[p * 3] = 0.13 * k; col[p * 3 + 1] = 0.52 * k; col[p * 3 + 2] = 0.88 * k;
    siz[p] = 0.0245 + 0.005 * rnd();
    p++;
  }

  /* ── 小脑：扁、宽、塞在枕叶下方，表面是横向叶片 ──────────────
     旧版是个孤立椭球悬在脑干后面、亮橙色——那不是小脑，那是长在脑子上的肿瘤。
     真实小脑：左右两半球 + 中间蚓部，宽约为大脑的 0.7，高只有 0.3，
     上缘**嵌进**枕叶下方（小脑幕之上），表面是一层层横纹（folia）。 */
  const CB = { cx: 0, cy: -0.395, cz: -0.640, ax: 0.225, ay: 0.140, az: 0.165 };
  const CB2 = [CB.ax * CB.ax, CB.ay * CB.ay, CB.az * CB.az];
  for (let i = 0; i < NB; i++) {
    let [bx, by, bz] = fib(i, NB);
    bx += (rnd() - 0.5) * 0.10; by += (rnd() - 0.5) * 0.10; bz += (rnd() - 0.5) * 0.10;
    const il = 1 / (Math.hypot(bx, by, bz) || 1);
    bx *= il; by *= il; bz *= il;
    // folia：沿 z 的密集横纹，这是小脑最好认的特征
    const folia = 0.020 * Math.sin(bz * 24 + 0.6) + 0.009 * Math.sin(bz * 41 - 1.2);
    // 蚓部：中线略凹，把两个小脑半球分开
    const vermis = 1 - 0.12 * Math.exp(-Math.pow(bx / 0.30, 2));
    const w = 1 + folia;
    const x = CB.cx + bx * CB.ax * w * vermis;
    const y = CB.cy + by * CB.ay * w;
    const z = CB.cz + bz * CB.az * w;
    const nx = (x - CB.cx) / CB2[0], ny = (y - CB.cy) / CB2[1], nz = (z - CB.cz) / CB2[2];
    const nl = Math.hypot(nx, ny, nz) || 1;
    const k = (0.22 + 0.90 * lamAt(nx, ny, nz)) * (0.80 + 0.20 * Math.tanh(folia * 70)) * (0.80 + 0.30 * rnd());
    pos[p * 3] = x; pos[p * 3 + 1] = y; pos[p * 3 + 2] = z;
    nrm[p * 3] = nx / nl; nrm[p * 3 + 1] = ny / nl; nrm[p * 3 + 2] = nz / nl;
    // 灰褐、压暗：它该融进整体，不该跳出来抢视线
    col[p * 3] = 0.58 * k; col[p * 3 + 1] = 0.44 * k; col[p * 3 + 2] = 0.38 * k;
    siz[p] = 0.0080 + 0.0026 * rnd();
    p++;
  }

  /* ── 脑干：中脑 → 脑桥（膨大）→ 延髓，从小脑**前方**垂下 ──────
     旧版是一根等径细管、直直吊在正中——那是输液管。
     真实脑干在小脑前方（z 更靠前），脑桥处明显向前膨出，延髓渐细。
     它同时是**整个侧面轮廓的高度来源**：大脑只到 -0.56，剩下的靠它。 */
  for (let i = 0; i < NS; i++) {
    const t = rnd();                       // 0=中脑（上） → 1=延髓（下）
    const y = -0.44 - t * 0.30;
    const bulge = Math.exp(-Math.pow((t - 0.32) / 0.18, 2)); // 脑桥
    const taper = 1 - 0.30 * smooth01(0.55, 1.0, t);
    const rad = (0.075 + 0.045 * bulge) * taper;
    const zc = -0.215 + t * 0.075;         // 向下略前倾
    const a = rnd() * TAU;
    const dx = Math.cos(a) * 1.18, dz = Math.sin(a) * 0.80;  // 横断面左右宽、前后扁
    const x = dx * rad, z = zc + dz * rad;
    const nl = Math.hypot(dx, 0, dz) || 1;
    const k = (0.22 + 0.86 * lamAt(dx, 0, dz)) * (0.80 + 0.30 * rnd());
    pos[p * 3] = x; pos[p * 3 + 1] = y; pos[p * 3 + 2] = z;
    nrm[p * 3] = dx / nl; nrm[p * 3 + 1] = 0; nrm[p * 3 + 2] = dz / nl;
    col[p * 3] = 0.50 * k; col[p * 3 + 1] = 0.38 * k; col[p * 3 + 2] = 0.68 * k;
    siz[p] = 0.0078 + 0.0026 * rnd();
    p++;
  }
  return { pos, col, siz, nrm, n: NPTS };
}

/* ── 实体落点 ───────────────────────────────────────────────── */
const TYPE_COLOR = {
  file: [0.31, 0.82, 1.00],
  rule: [1.00, 0.82, 0.40],
  action: [0.73, 0.55, 1.00],
  trigger: [1.00, 0.42, 0.54],
  tool: [0.43, 0.91, 0.66],
};
const TYPE_LABEL = { file: "文件", rule: "条号", action: "动作", trigger: "触发", tool: "工具" };
const TYPE_ORDER = ["file", "rule", "action", "trigger", "tool"];
const REGION_LABEL = { stem: "脑干", cerebellum: "小脑", left: "大脑·左", right: "大脑·右" };
const REGION_NOTE = { stem: "硬约束 ∞", cerebellum: "程序 180d", left: "判据 60d", right: "叙事 30d" };

const mesh = buildMesh();

/* 分区顶点池：解剖位置就是语义。
   大脑两半球按 x 正负分左右，小脑与脑干各取自己的那一段。
   实体的落点在**自己那块的池子里**按哈希取——所以"脑干上的东西"永远长在脑干上。 */
const POOL = { left: [], right: [], cerebellum: [], stem: [] };
for (let i = 0; i < NPTS; i++) {
  if (i < NC) (mesh.pos[i * 3] < 0 ? POOL.left : POOL.right).push(i);
  else if (i < NC + NB) POOL.cerebellum.push(i);
  else POOL.stem.push(i);
}

const nodes = DATA.nodes.map((n) => {
  const pool = POOL[n.r] || POOL.right;
  const vi = pool[hash(n.id) % pool.length];
  const j = hash(n.id + "#") / 4294967296;
  const a = hash(n.id + "@") / 4294967296 * Math.PI * 2;
  /* 沿**表面法线往外**顶一点，不要随机方向。
     随机方向有一半落到皮层里面，深度测试一开就全被埋掉；
     贴着表面又和皮层 z-fighting。往外 0.02 刚好浮在表面上方。 */
  const r = 0.020 + 0.022 * j;
  const nx = mesh.nrm[vi * 3], ny = mesh.nrm[vi * 3 + 1], nz = mesh.nrm[vi * 3 + 2];
  return {
    ...n,
    x: mesh.pos[vi * 3] + nx * r + Math.cos(a) * 0.012,
    y: mesh.pos[vi * 3 + 1] + ny * r + (j - 0.5) * 0.016,
    z: mesh.pos[vi * 3 + 2] + nz * r + Math.sin(a) * 0.012,
    color: TYPE_COLOR[n.type] || [0.8, 0.8, 0.8],
  };
});

/* 大小与亮度 = 遗忘曲线。
   强度跨四个数量级（3700 : 1.4），线性缩放会让大多数点直接看不见，所以走对数。
   另外加一条**褪色**判据：距上次出现超过半衰期的，向灰收敛——那才是"忘了"的样子，
   而强度只说明"记得多深"。两件事分开，才不会把"很久没提"误读成"从来没重要过"。 */
const maxS = Math.max(1, ...nodes.map((n) => n.s || 0));
const LOG_MAX = Math.log1p(maxS);
const GEN = Date.parse(DATA.meta.generatedAt) || Date.now();
const GRAY = [0.30, 0.33, 0.38];
for (const n of nodes) {
  const k = Math.log1p(n.s || 0) / LOG_MAX;
  /* 同一套大小放到不同器官上尺度不一样：脑干半径只有大脑的 1/8，
     0.039 的球贴上去就是一颗亮瘤子。按区域缩。
     脑干 41 个实体挤在那么细的一根管上，不缩就是一团加法混合的白光。 */
  const shrink = n.r === "stem" ? 0.42 : n.r === "cerebellum" ? 0.66 : 1;
  n.size = (0.005 + 0.034 * Math.pow(k, 0.8)) * shrink;
  n.fade = 0.22 + 0.78 * Math.pow(k, 0.5);
  const hl = DATA.meta.halfLives ? DATA.meta.halfLives[n.r] : null;
  const age = (GEN - Date.parse(n.l || "")) / 86400e3;
  const stale = hl ? Math.min(1, Math.max(0, age / hl)) : 0;
  // 褪色封顶 0.6：颜色本身也是信息（哪类是文件、哪类是条号），褪成纯灰等于把色标废掉。
  // 用 stale² 而不是 stale：只有"超过半衰期很久"的才明显发灰，"上周还提过"的只轻微降饱和。
  const w = Math.min(0.6, stale * stale * 0.7 + ((n.s || 0) < 0.4 ? 0.25 : 0));
  n.color = n.color.map((c, i) => c + (GRAY[i] - c) * w);
  n.alpha = 1;
}

/* ── WebGL ──────────────────────────────────────────────────── */
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl", { antialias: true, alpha: false, premultipliedAlpha: false });
if (!gl) {
  const e = document.getElementById("err");
  e.style.display = "grid";
  e.textContent = "这个浏览器/面板没有 WebGL。用 Chrome / Edge 打开本地文件即可。";
}

/* 皮层：**不透明、写深度**。
   上一版是加法混合 + 关深度测试，于是每一条视线都要穿过 100 层点，
   84k 点叠出来的是一团雾——你看到的是"点云的统计"，不是"表面"。
   深度一开，只画看得见的那一面，填充率掉一个数量级，形也立起来了。 */
const SHELL_VS = `
attribute vec3 aPos; attribute vec3 aCol; attribute float aSize;
uniform mat4 uMVP; uniform vec3 uEye; uniform float uPix;
varying vec3 vCol;
void main(){
  vec4 p = uMVP * vec4(aPos, 1.0);
  gl_Position = p;
  gl_PointSize = clamp(aSize * uPix / max(p.w, 0.05), 1.5, 40.0);
  /* 漫反射在 CPU 上烘好了（跟视角无关）。这里只补一项**跟视角有关**的边缘光，
     它负责把轮廓从背景里勾出来——没有它，深蓝的脑贴在近黑的背景上是一团糊。 */
  vec3 n = normalize(aPos);
  vec3 v = normalize(uEye - aPos);
  float rim = pow(1.0 - max(0.0, dot(n, v)), 2.4);
  vCol = aCol + vec3(0.11, 0.21, 0.34) * rim;
}`;

const SHELL_FS = `
precision mediump float;
varying vec3 vCol;
void main(){
  vec2 d = gl_PointCoord - vec2(0.5);
  if (dot(d, d) > 0.25) discard;
  gl_FragColor = vec4(vCol, 1.0);
}`;

/* 节点：加法混合（要发光），但不写深度——否则后面画的高光会被它挡住。 */
const NODE_VS = `
attribute vec3 aPos; attribute vec3 aCol; attribute float aSize; attribute float aAlpha;
uniform mat4 uMVP; uniform float uPix; uniform float uAlphaMul;
varying vec3 vCol; varying float vA;
void main(){
  vec4 p = uMVP * vec4(aPos, 1.0);
  gl_Position = p;
  gl_PointSize = clamp(aSize * uPix / max(p.w, 0.05), 2.0, 64.0);
  vCol = aCol; vA = aAlpha * uAlphaMul;
}`;

const NODE_FS = `
precision mediump float;
varying vec3 vCol; varying float vA;
void main(){
  vec2 d = gl_PointCoord - vec2(0.5);
  float r2 = dot(d, d);
  if (r2 > 0.25) discard;
  gl_FragColor = vec4(vCol, (1.0 - smoothstep(0.02, 0.25, r2)) * vA);
}`;

/* 边：整体外扩 1.5%，免得和皮层共面 z-fighting。
   深度测试一开，穿过脑内部的长弦自动被前面那层皮挡掉——
   "蜘蛛网"是**没有深度**造成的，不是边太多。 */
const LINE_VS = `
attribute vec3 aPos; attribute vec3 aCol; attribute float aAlpha;
uniform mat4 uMVP;
varying vec3 vCol; varying float vA;
void main(){ gl_Position = uMVP * vec4(aPos * 1.015, 1.0); vCol = aCol; vA = aAlpha; }`;

const LINE_FS = `
precision mediump float;
varying vec3 vCol; varying float vA;
void main(){ gl_FragColor = vec4(vCol, vA); }`;

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
/* 位置在链接后**取一次**就存起来。
   上一版每次 draw 都调 getAttribLocation / getUniformLocation——那是字符串查表，
   一帧 17 次、60 帧 1000+ 次。这不叫渲染，这叫每帧重新问一遍"这个变量在哪"。 */
function program(vs, fs, attrs, unis) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const a = {}, u = {};
  for (const n of attrs) a[n] = gl.getAttribLocation(p, n);
  for (const n of unis) u[n] = gl.getUniformLocation(p, n);
  return { p, a, u };
}

const pShell = program(SHELL_VS, SHELL_FS, ["aPos", "aCol", "aSize"], ["uMVP", "uEye", "uPix"]);
const pNode = program(NODE_VS, NODE_FS, ["aPos", "aCol", "aSize", "aAlpha"], ["uMVP", "uPix", "uAlphaMul"]);
const pLine = program(LINE_VS, LINE_FS, ["aPos", "aCol", "aAlpha"], ["uMVP"]);

function buffer(data, usage) {
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, data, usage || gl.STATIC_DRAW);
  return b;
}
function bindAttr(prog, name, buf, size) {
  const l = prog.a[name];
  if (l === undefined || l < 0) return;
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.enableVertexAttribArray(l);
  gl.vertexAttribPointer(l, size, gl.FLOAT, false, 0, 0);
}

/* 皮层（法线也传上去——不给它用，但以后要加边缘光就不用改缓冲） */
const bShellPos = buffer(mesh.pos), bShellCol = buffer(mesh.col), bShellSiz = buffer(mesh.siz);

/* 节点 */
const N = nodes.length;
const nPos = new Float32Array(N * 3), nCol = new Float32Array(N * 3), nSiz = new Float32Array(N), nAlp = new Float32Array(N);
nodes.forEach((n, i) => {
  nPos[i * 3] = n.x; nPos[i * 3 + 1] = n.y; nPos[i * 3 + 2] = n.z;
  nCol[i * 3] = n.color[0]; nCol[i * 3 + 1] = n.color[1]; nCol[i * 3 + 2] = n.color[2];
  nSiz[i] = n.size; nAlp[i] = n.fade;
});
const bNPos = buffer(nPos), bNCol = buffer(nCol), bNSiz = buffer(nSiz), bNAlp = buffer(nAlp, gl.DYNAMIC_DRAW);

/* 边只在**选中某个实体时**画，平时一条都不画。
   理由不是"太卡"，是**它本来就不该出现在那个位置**：边是关系，不是几何。
   A 和 B 在同一条日志里出现过，不代表它们之间有一根结构——把它画成穿过
   脑内部的弦，等于凭空造出一根不存在的东西；1210 条这样的弦铺满屏幕
   就是"蜘蛛网 / 裂纹玻璃"。点开实体时它才有意义：那时你要看"这个跟谁连着"。
   而且那时它是**覆盖层**，不参与深度测试——关系不该被皮肉挡住。 */
const MAXSEL = 256;
const selPos = new Float32Array(MAXSEL * 6), selCol = new Float32Array(MAXSEL * 6), selAlp = new Float32Array(MAXSEL * 2);
const bSelPos = buffer(selPos, gl.DYNAMIC_DRAW), bSelCol = buffer(selCol, gl.DYNAMIC_DRAW), bSelAlp = buffer(selAlp, gl.DYNAMIC_DRAW);
let selN = 0;
const INF_COLOR = [0.58, 0.63, 0.76];

/* 悬停高亮：单顶点缓冲，避免每帧新建 */
const bHovPos = buffer(new Float32Array(3), gl.DYNAMIC_DRAW);
const bHovCol = buffer(new Float32Array(3), gl.DYNAMIC_DRAW);
const bHovSiz = buffer(new Float32Array(1), gl.DYNAMIC_DRAW);
const bHovAlp = buffer(new Float32Array([1]), gl.DYNAMIC_DRAW);

/* ── 矩阵 ───────────────────────────────────────────────────── */
function perspective(out, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
  out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
  out[8] = 0; out[9] = 0; out[10] = (far + near) * nf; out[11] = -1;
  out[12] = 0; out[13] = 0; out[14] = 2 * far * near * nf; out[15] = 0;
  return out;
}
function lookAt(out, eye, ctr, up) {
  let z0 = eye[0] - ctr[0], z1 = eye[1] - ctr[1], z2 = eye[2] - ctr[2];
  let l = 1 / Math.hypot(z0, z1, z2); z0 *= l; z1 *= l; z2 *= l;
  let x0 = up[1] * z2 - up[2] * z1, x1 = up[2] * z0 - up[0] * z2, x2 = up[0] * z1 - up[1] * z0;
  l = Math.hypot(x0, x1, x2) || 1; l = 1 / l; x0 *= l; x1 *= l; x2 *= l;
  const y0 = z1 * x2 - z2 * x1, y1 = z2 * x0 - z0 * x2, y2 = z0 * x1 - z1 * x0;
  out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
  out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
  out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
  out[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
  out[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
  out[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
  out[15] = 1;
  return out;
}
function mul(out, a, b) {
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    out[i * 4 + j] = a[j] * b[i * 4] + a[4 + j] * b[i * 4 + 1] + a[8 + j] * b[i * 4 + 2] + a[12 + j] * b[i * 4 + 3];
  }
  return out;
}

/* ── 相机 ───────────────────────────────────────────────────── */
/* 这几个状态在 resize() 里就会被写，所以必须先声明（let 有 TDZ，晚一步就是
   ReferenceError: Cannot access 'dirty' before initialization）。 */
let pixBase = 1, dirty = true, lastT = 0, msAcc = 0, msN = 0;

const FOV = Math.PI / 4.4;
let yaw = Math.PI / 2, pitch = 0.10, dist = 3.15;
let autoRotate = true, dragging = false;
const proj = new Float32Array(16), view = new Float32Array(16), mvp = new Float32Array(16);
const eye = [0, 0, 0];

/* DPR 上限 1.75：再往上画的是像素，不是信息。掉帧时由 frame() 降到 1。 */
let dprCur = Math.min(1.75, window.devicePixelRatio || 1);
function resize() {
  canvas.width = Math.floor(innerWidth * dprCur);
  canvas.height = Math.floor(innerHeight * dprCur);
  gl.viewport(0, 0, canvas.width, canvas.height);
  updPix();
  dirty = true;
}
addEventListener("resize", resize);
resize();

/* ── 过滤 ───────────────────────────────────────────────────── */
const offTypes = new Set();
const typeCount = {};
for (const n of nodes) typeCount[n.type] = (typeCount[n.type] || 0) + 1;

function applyFilters() {
  dirty = true;
  nodes.forEach((n, i) => { nAlp[i] = offTypes.has(n.type) ? 0 : n.fade; });
  gl.bindBuffer(gl.ARRAY_BUFFER, bNAlp);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, nAlp);
  applyEdgeFilter();
}

let selected = -1, neighbors = null, showInf = true;

/* 选中某个实体时，把它的边装进一个小缓冲（上限 256 条）。
   只装这一个实体的边，所以缓冲很小、只在选中时重建一次，不占每帧成本。 */
function buildSelEdges() {
  selN = 0;
  if (selected < 0) return;
  for (const e of DATA.edges) {
    if (e.s !== selected && e.t !== selected) continue;
    if (selN >= MAXSEL) break;
    if (offTypes.has(nodes[e.s].type) || offTypes.has(nodes[e.t].type)) continue;
    if (!showInf && e.k === "inf") continue;
    const a = nodes[e.s], b = nodes[e.t];
    const i = selN++;
    selPos.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6);
    const c = e.k === "inf"
      ? INF_COLOR
      : [(a.color[0] + b.color[0]) / 2, (a.color[1] + b.color[1]) / 2, (a.color[2] + b.color[2]) / 2];
    selCol.set([...c, ...c], i * 6);
    const al = e.k === "inf" ? Math.min(0.30, 0.10 + e.v * 0.10) : Math.min(0.55, 0.22 + Math.min(e.v, 8) * 0.05);
    selAlp[i * 2] = al; selAlp[i * 2 + 1] = al;
  }
  if (!selN) return;
  gl.bindBuffer(gl.ARRAY_BUFFER, bSelPos); gl.bufferSubData(gl.ARRAY_BUFFER, 0, selPos);
  gl.bindBuffer(gl.ARRAY_BUFFER, bSelCol); gl.bufferSubData(gl.ARRAY_BUFFER, 0, selCol);
  gl.bindBuffer(gl.ARRAY_BUFFER, bSelAlp); gl.bufferSubData(gl.ARRAY_BUFFER, 0, selAlp);
}

function applyEdgeFilter() {
  dirty = true;
  buildSelEdges();
  // 选中时把邻居点亮
  nodes.forEach((n, i) => {
    let v = offTypes.has(n.type) ? 0 : n.fade;
    if (selected >= 0 && i !== selected) v *= neighbors && neighbors.has(i) ? 1 : 0.35;
    nAlp[i] = v;
  });
  gl.bindBuffer(gl.ARRAY_BUFFER, bNAlp);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, nAlp);
}

/* ── 渲染 ───────────────────────────────────────────────────── */
function updPix() { pixBase = canvas.height / (2 * Math.tan(FOV / 2)); }

function drawShell() {
  gl.useProgram(pShell.p);
  gl.uniformMatrix4fv(pShell.u.uMVP, false, mvp);
  gl.uniform3fv(pShell.u.uEye, eye);
  gl.uniform1f(pShell.u.uPix, pixBase);
  bindAttr(pShell, "aPos", bShellPos, 3);
  bindAttr(pShell, "aCol", bShellCol, 3);
  bindAttr(pShell, "aSize", bShellSiz, 1);
  gl.drawArrays(gl.POINTS, 0, NPTS);
}

function drawNodes(bufPos, bufCol, bufSiz, bufAlp, count, sizeMul, alphaMul) {
  gl.useProgram(pNode.p);
  gl.uniformMatrix4fv(pNode.u.uMVP, false, mvp);
  gl.uniform1f(pNode.u.uPix, pixBase * sizeMul);
  gl.uniform1f(pNode.u.uAlphaMul, alphaMul);
  bindAttr(pNode, "aPos", bufPos, 3);
  bindAttr(pNode, "aCol", bufCol, 3);
  bindAttr(pNode, "aSize", bufSiz, 1);
  bindAttr(pNode, "aAlpha", bufAlp, 1);
  gl.drawArrays(gl.POINTS, 0, count);
}

function drawSelLines() {
  if (!selN) return;
  gl.useProgram(pLine.p);
  gl.uniformMatrix4fv(pLine.u.uMVP, false, mvp);
  bindAttr(pLine, "aPos", bSelPos, 3);
  bindAttr(pLine, "aCol", bSelCol, 3);
  bindAttr(pLine, "aAlpha", bSelAlp, 1);
  gl.drawArrays(gl.LINES, 0, selN * 2);
}

/* 静止时一帧都不算。
   上一版不管有没有变化都每帧重画 8.4 万点——那是"让显卡硬算"最直白的样子：
   画面一动不动，GPU 照样满载。 */
function frame(t) {
  requestAnimationFrame(frame);
  const dt = lastT ? t - lastT : 16;
  lastT = t;

  if (!autoRotate && !dragging && !dirty) return;
  dirty = false;
  if (!dragging && autoRotate) yaw += 0.0016;

  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  eye[0] = dist * cp * Math.sin(yaw); eye[1] = dist * sp; eye[2] = dist * cp * Math.cos(yaw);
  lookAt(view, eye, [0, -0.04, 0], [0, 1, 0]);

  mul(mvp, proj, view);

  gl.clearColor(0.016, 0.023, 0.047, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  /* 皮层：不透明 + 写深度。只画看得见的那一面，后面的点被深度挡掉。 */
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  drawShell();

  /* 边与节点：测深度但不写深度——否则先画的点会把后面同位置的点挡住。 */
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  drawNodes(bNPos, bNCol, bNSiz, bNAlp, N, 2.6, 0.07);   // 晕
  drawNodes(bNPos, bNCol, bNSiz, bNAlp, N, 1.0, 1.0);    // 核

  /* 选中的边最后画、关深度测试：它是**覆盖层**。
     关系不是长在肉上的，不该被前面的皮层挡住——挡住就等于没画。 */
  if (selN) { gl.disable(gl.DEPTH_TEST); drawSelLines(); gl.enable(gl.DEPTH_TEST); }

  if (hover >= 0) {
    const n = nodes[hover];
    gl.bindBuffer(gl.ARRAY_BUFFER, bHovPos); gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array([n.x, n.y, n.z]));
    gl.bindBuffer(gl.ARRAY_BUFFER, bHovCol); gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(n.color));
    gl.bindBuffer(gl.ARRAY_BUFFER, bHovSiz); gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array([n.size]));
    drawNodes(bHovPos, bHovCol, bHovSiz, bHovAlp, 1, 4.2, 0.45);
  }

  /* 自适应分辨率：连续掉帧就降 DPR，不再硬扛。
     数字摆在 HUD 上，省得又变成我口头保证"它不卡"。 */
  msAcc += dt; msN++;
  if (msN >= 45) {
    const avg = msAcc / msN;
    msAcc = 0; msN = 0;
    if (avg > 26 && dprCur > 1) { dprCur = 1; resize(); }
    showPerf(avg);
  }
}

/* ── 拾取 ───────────────────────────────────────────────────── */
let hover = -1;
const scr = new Float32Array(N * 3);

function projectAll() {
  const W = canvas.width, H = canvas.height;
  for (let i = 0; i < N; i++) {
    const x = nodes[i].x, y = nodes[i].y, z = nodes[i].z;
    const w = mvp[3] * x + mvp[7] * y + mvp[11] * z + mvp[15];
    if (w <= 0.01) { scr[i * 3 + 2] = -1; continue; }
    const cx = (mvp[0] * x + mvp[4] * y + mvp[8] * z + mvp[12]) / w;
    const cy = (mvp[1] * x + mvp[5] * y + mvp[9] * z + mvp[13]) / w;
    scr[i * 3] = (cx * 0.5 + 0.5) * W;
    scr[i * 3 + 1] = (1 - (cy * 0.5 + 0.5)) * H;
    scr[i * 3 + 2] = w;
  }
}

function pick(clientX, clientY) {
  projectAll();
  const dpr = canvas.width / innerWidth;
  const mx = clientX * dpr, my = clientY * dpr;
  let best = -1, bestD = 22 * dpr * 22 * dpr;
  for (let i = 0; i < N; i++) {
    if (nAlp[i] <= 0 || scr[i * 3 + 2] <= 0) continue;
    const dx = scr[i * 3] - mx, dy = scr[i * 3 + 1] - my;
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

/* ── HUD ────────────────────────────────────────────────────── */
const metaEl = document.getElementById("meta");
const m = DATA.meta;
const regionLine = Object.keys(REGION_LABEL)
  .filter((k) => m.regions && m.regions[k])
  .map((k) => `${REGION_LABEL[k]} <b>${m.regions[k]}</b>`)
  .join(" · ");
metaEl.innerHTML =
  `<b>${m.events.toLocaleString()}</b> 条事件 · ${(m.from || "").slice(0, 10)} → ${(m.to || "").slice(0, 10)}<br>` +
  `<b>${m.nodes}</b> 实体 / <b>${m.edges}</b> 条共现` +
  (m.truncated ? `（原 ${m.total}，按强度截断）` : "") +
  `<br>${regionLine}`;

const footEl = document.getElementById("foot");
const FOOT_TEXT = `位置 = <b>FNV-1a(实体名)</b> → 分区顶点（不变）　大小 = <b>遗忘曲线</b>（在用则亮，久不用则灰）`;
footEl.innerHTML = FOOT_TEXT;

/* 把帧时间摆出来。性能这件事不能靠我口头保证，得让人一眼看见。 */
function showPerf(ms) {
  const t = ms.toFixed(1);
  footEl.innerHTML = `${FOOT_TEXT}　·　<b>${t} ms</b>/帧 @ ${dprCur}x`;
}

const lgs = document.getElementById("lgs");
for (const tp of TYPE_ORDER) {
  const n = typeCount[tp] || 0;
  if (!n) continue;
  const el = document.createElement("div");
  el.className = "lg";
  el.innerHTML = `<span class="dot" style="background:${rgb(TYPE_COLOR[tp])};color:${rgb(TYPE_COLOR[tp])}"></span>` +
    `<span class="n">${TYPE_LABEL[tp]}</span><span class="v">${n}</span>`;
  el.onclick = () => {
    if (offTypes.has(tp)) offTypes.delete(tp); else offTypes.add(tp);
    el.classList.toggle("off", offTypes.has(tp));
    applyFilters();
  };
  lgs.appendChild(el);
}

/* 推断边开关。单独一行，因为它是**另一个物种**：事实是记录下来的，推断是算出来的。 */
const infRow = document.getElementById("infRow");
const infCount = DATA.meta.inferred || 0;
if (infCount) {
  infRow.className = "lg";
  infRow.title = "A 与 B 从未在同一行出现，但共享 ≥2 个冷门中间物（Adamic-Adar）";
  infRow.innerHTML =
    `<span class="dot" style="background:${rgb(INF_COLOR)};color:${rgb(INF_COLOR)};box-shadow:none"></span>` +
    `<span class="n">推断关联</span><span class="v">${infCount}</span>`;
  infRow.onclick = () => {
    showInf = !showInf;
    infRow.classList.toggle("off", !showInf);
    applyEdgeFilter();
  };
}

function rgb(c) { return `rgb(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)})`; }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

const card = document.getElementById("card");
function showCard(i) {
  const n = nodes[i];
  const hlv = m.halfLives ? m.halfLives[n.r] : null;
  const hl = hlv === null || hlv === undefined ? "∞" : `${hlv}d`;
  const cl = m.clusters ? m.clusters.find((c) => c.i === n.cl) : null;
  document.getElementById("cardKind").textContent =
    `${REGION_LABEL[n.r] || n.r} · ${TYPE_LABEL[n.type] || n.type} · 半衰期 ${hl}` +
    (cl ? ` · 簇「${cl.name}」${cl.size} 个` : "");
  document.getElementById("cardName").textContent = n.name;
  document.getElementById("cardMeta").textContent =
    `出现 ${n.c} 次　强度 ${n.s}　${(n.f || "").slice(0, 16).replace("T", " ")} → ${(n.l || "").slice(0, 16).replace("T", " ")}`;
  const evHtml = (n.ev || []).map((s) => `<div class="ev">${esc(s)}</div>`).join("") ||
    `<div class="ev" style="opacity:.5">无证据文本</div>`;
  const infs = DATA.edges
    .filter((e) => e.k === "inf" && (e.s === i || e.t === i))
    .sort((a, b) => b.v - a.v)
    .slice(0, 6);
  const infHtml = infs.length
    ? `<div class="k" style="margin-top:11px">推断关联 · 从未同现，三个信号合成</div>` +
      infs.map((e) => {
        const o = nodes[e.s === i ? e.t : e.s];
        const p = e.parts || {};
        return `<div class="ev inf">↔ ${esc(o.name)}<br><span class="dim">结构 ${p.aa ?? "-"} · 亲缘 ${p.aff ?? "-"} · 共活跃 ${p.tmp ?? "-"}　→ ${e.v}</span></div>`;
      }).join("")
    : "";
  document.getElementById("cardEv").innerHTML = evHtml + infHtml;
  card.classList.add("show");
}
function hideCard() { card.classList.remove("show"); }

document.getElementById("cardClose").onclick = () => {
  selected = -1; neighbors = null; hideCard(); applyFilters();
};

/* ── 交互 ───────────────────────────────────────────────────── */
let px = 0, py = 0, moved = 0;

canvas.addEventListener("pointerdown", (e) => {
  dragging = true; moved = 0; px = e.clientX; py = e.clientY;
  canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointerup", (e) => {
  dragging = false; canvas.classList.remove("drag");
  if (moved < 6) {
    const i = pick(e.clientX, e.clientY);
    if (i >= 0) {
      selected = i;
      neighbors = new Set();
      for (const ed of DATA.edges) { if (ed.s === i) neighbors.add(ed.t); else if (ed.t === i) neighbors.add(ed.s); }
      showCard(i); applyEdgeFilter();
    } else { selected = -1; neighbors = null; hideCard(); applyEdgeFilter(); }
  }
});
canvas.addEventListener("pointermove", (e) => {
  if (dragging) {
    const dx = e.clientX - px, dy = e.clientY - py;
    moved += Math.abs(dx) + Math.abs(dy);
    yaw -= dx * 0.005;
    pitch = Math.max(-1.45, Math.min(1.45, pitch + dy * 0.005));
    px = e.clientX; py = e.clientY;
  } else {
    const i = pick(e.clientX, e.clientY);
    if (i !== hover) { hover = i; dirty = true; canvas.style.cursor = i >= 0 ? "pointer" : "grab"; }
  }
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  dist = Math.max(1.7, Math.min(7.5, dist * Math.exp(e.deltaY * 0.0012)));
  dirty = true;
}, { passive: false });
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); autoRotate = !autoRotate; dirty = true; }
  if (e.code === "Escape") { selected = -1; neighbors = null; hideCard(); applyFilters(); }
});

/* ── 起飞 ───────────────────────────────────────────────────── */
if (gl) {
  if (N === 0) {
    const e = document.getElementById("err");
    e.style.display = "grid";
    e.textContent = "日志里没有可用的实体。换一个 --log 再试。";
  }
  requestAnimationFrame(frame);
}
</script>
