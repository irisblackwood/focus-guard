name: publish

# Trusted Publishing（OIDC）：不存任何 npm token，由 GitHub 和 npm 之间用短期 OIDC 断言授权。
# 触发：手动 run，或发布 Release。
#
# ⚠ 前置条件（一次性，必须在 npm 网页上做）：
#   1. 包必须**已经存在于 registry**（首次发布只能用 token 发一次，OIDC 不能创建新包）。
#   2. npmjs.com → Packages → focus-guard → Settings → Trusted publishing → Add GitHub Actions
#        Organization/User: irisblackwood
#        Repository:        focus-guard
#        Workflow filename: publish.yml
#        Environment:       （留空）
#   3. 之后每次发版：改 packages/core/package.json 的 version → 推 tag → 跑本 workflow。

on:
  workflow_dispatch:
  release:
    types: [published]

# 同一时间只允许一个发布作业：并发触发会让后一个撞上 "cannot publish over" 而红。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC 必需：换取 npm 的短期发布凭据

jobs:
  publish:
    name: npm publish (OIDC)
    # 验收套件里有 4 条 Windows 专用断言（shell 检测的 win32 分支），仓库 CI 同样把 Linux 标为观察项。
    # 发布闸必须跑在必过平台上，否则会被这些用例挡住（2026-10-18 实测：ubuntu 上 Test suite 红）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1；Node 24 自带的 npm 可能刚好不够。
      # 2026-10-18：从 `npm@latest` 改为**锁大版本**——latest 每次可能带进新的 2FA/GAT 策略，
      # 发布日志会突然因为上游策略变化而红（本仓库已踩过两次）。锁 11 大版本，行为可预期。
      - name: Ensure npm >= 11.5.1
        run: |
          npm install -g npm@11
          npm --version
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);if(v[0]<11||(v[0]===11&&v[1]<5)){console.error('npm too old:',v.join('.'));process.exit(1)}"

      # 发布前先跑闸：CI 红就不发。
      - name: Test suite
        run: npm test
        working-directory: packages/core

      - name: Publish
        working-directory: packages/core
        run: npm publish --access public --provenance

      - name: Verify
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          npm view focus-guard version dist.tarball
