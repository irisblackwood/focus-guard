name: publish

# Trusted Publishing（OIDC）：不存任何 npm token，由 GitHub 和 npm 之间用短期 OIDC 断言授权。
# 触发：手动 run，或发布 Release。
#
# ⚠ 前置条件（一次性，必须在 npm 网页上做）：
#   1. 包必须**已经存在于 registry**（首次发布只能用 token 发一次，OIDC 不能创建新包）。
#   2. npmjs.com → Packages → focus-guard → Settings → Trusted publishing → Add GitHub Actions
#        Organization/User: irisblackwood
#        Repository:        focus-guard
#        Workflow filename: publish.yml
#        Environment:       （留空）
#   3. 之后每次发版：改 packages/core/package.json 的 version → 推 tag → 跑本 workflow。

on:
  workflow_dispatch:
  release:
    types: [published]

# 同一时间只允许一个发布作业：并发触发会让后一个撞上 "cannot publish over" 而红。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC 必需：换取 npm 的短期发布凭据

jobs:
  publish:
    name: npm publish (OIDC)
    # 验收套件里有 4 条 Windows 专用断言（shell 检测的 win32 分支），仓库 CI 同样把 Linux 标为观察项。
    # 发布闸必须跑在必过平台上，否则会被这些用例挡住（2026-10-18 实测：ubuntu 上 Test suite 红）。
    runs-on: windows-latest
    # 上限 15 分钟：正常路径应 ≤2 分钟（3.5.2 实测 4m36s，其中 3m04s 是旧的 Verify 轮询）。
    # 卡住时别占着 runner 跑满默认 360 分钟——红灯要快，慢红等于没红。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1；Node 24 自带的 npm 可能刚好不够。
      # 2026-10-18：从 `npm@latest` 改为**锁大版本**——latest 每次可能带进新的 2FA/GAT 策略，
      # 发布日志会突然因为上游策略变化而红（本仓库已踩过两次）。锁 11 大版本，行为可预期。
      #
      # 2026-11-26 提速：原先无条件 `npm install -g npm@11`，实测 21s（占发布前耗时的 1/4）——
      # 而 runner 自带的 npm 常常已经 >= 11.5.1。改成**先看版本，不够才装**：够就一个进程都不起。
      - name: Ensure npm >= 11.5.1（够了就不装）
        shell: pwsh
        run: |
          # 全程 pwsh：本文件其余步骤都是 pwsh，混进 bash 只为了省两行，会在
          # Windows runner 的路径/引号差异上埋雷（GITHUB_OUTPUT 是 `D:\a\_temp\…`）。
          $need = node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);process.stdout.write(v[0]<11||(v[0]===11&&v[1]<5)?'1':'0')"
          Write-Output "npm 当前 $(npm --version)，需要升级=$need"
          if ($need -eq '1') {
            npm install -g npm@11
            if ($LASTEXITCODE -ne 0) { Write-Error 'npm 升级失败'; exit 1 }
          }
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);if(v[0]<11||(v[0]===11&&v[1]<5)){console.error('npm too old:',v.join('.'));process.exit(1)}"
          if ($LASTEXITCODE -ne 0) { Write-Error 'npm 仍低于 11.5.1'; exit 1 }

      # 发布闸：跑**整条** `npm run check`（根目录），不是只跑测试。
      #
      # 2026-11-08 修：此前是 `npm test` + `working-directory: packages/core`，只跑
      # `tests/audit-isolation.mjs`（763 条测试，但**仅此一项**）。eval / eval:dsh / selftest /
      # bridges / privacy:gate / manifest:check / docs:lint / lint / smells / schema:verify
      # 全都不在发布路径上——测试绿而说明漂移、死链、结构异味超标，照样能发出去。
      # 判据：发布门必须与本地 `npm run check` **同一条命令**，否则"本地绿"不保证"发得出去"。
      - name: 发布闸（整条 check 链）
        run: npm run check

      # 幂等守卫（2026-11-17）：本 workflow 也由 `release: published` 触发，而给历史版本
      # 补建 Release 是正当操作。没有这道守卫，补建一次就红一次（npm 拒绝覆盖已发版本）。
      # 判据是 registry 里**这个版本**在不在，不是 latest 指向哪。
      #
      # 2026-11-26：探测从 `npm view` 换成 `registry-check --once`——直接读**版本文档**，
      # 不冷启动 npm、不吃 packument 的 CDN 缓存，1~2 秒出结论。
      # 退出码要分开处理：0 有 / 1 没有 / 其它 = 查不了。**查不了就停下**，
      # 带着「反正没发过」的假设去 publish，只会撞 npm 的 EEXISTS 红。
      - name: 版本已在 registry 则跳过发布
        id: guard
        shell: pwsh
        run: |
          node packages/core/tools/registry-check.mjs --once
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Output "registry 已有该版本——本次只补 GitHub Release，不重发。"
          } elseif ($code -eq 1) {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Error "registry 探测失败（exit $code）——查不了不等于没发过，停止发布"
            exit 1
          }
          # 包装脚本会在末尾 `exit $LASTEXITCODE`，而「查不到」在本步留下 1 是正常结果。
          exit 0

      - name: Publish
        if: steps.guard.outputs.skip != 'true'
        working-directory: packages/core
        shell: pwsh
        run: |
          # 判绿看的是**registry 的 201 回执**，不是「命令没报错」。npm 在收到写入后才打印
          # `+ focus-guard@<v>`；没有这一行就说明只是退出了 0，不能当发成功。
          $v = node -p "require('./package.json').version"
          $out = (npm publish --access public --provenance 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { Write-Error "npm publish 失败（exit $code）"; exit 1 }
          if ($out -notmatch "\+\s+focus-guard@$([regex]::Escape($v))") {
            Write-Error "npm 没有确认收到 $v：输出里找不到 `+ focus-guard@$v`"
            exit 1
          }
          Write-Output "registry 已接收 focus-guard@$v（201 回执）"

      # Verify：**观察，不判红**。
      #
      # 2026-11-26 实测推翻了「版本文档秒级可读」这个假设：run 45842083164 里 14:46:14 收到
      # 201，14:48:13 查 `/focus-guard/3.5.3` 仍是 404（连加 `?bust=` 穿透缓存也是 404）——
      # 是 npm 官方复制管线的延迟，与本仓无关，也和 2026-11-17 记的「还要过两三分钟」一致。
      # 所以这里判红只会得到一条**每发一版必红**的闸门，训练人忽略告警（本仓在 schema:verify
      # 与 lint 上都踩过同一个坑）。判据改成：Publish 步自己认 201 回执；可读性交给
      # `npm run release:status` 事后复核（它同时看 tag / Release / registry / 工作流四面）。
      - name: Verify（可读性观察，不判红）
        continue-on-error: true
        run: node packages/core/tools/registry-check.mjs --wait 45


