name: publish

# Trusted Publishing（OIDC）：不存任何 npm token，由 GitHub 和 npm 之间用短期 OIDC 断言授权。
# 触发：手动 run，或发布 Release。
#
# ⚠ 前置条件（一次性，必须在 npm 网页上做）：
#   1. 包必须**已经存在于 registry**（首次发布只能用 token 发一次，OIDC 不能创建新包）。
#   2. npmjs.com → Packages → focus-guard → Settings → Trusted publishing → Add GitHub Actions
#        Organization/User: irisblackwood
#        Repository:        focus-guard
#        Workflow filename: publish.yml
#        Environment:       （留空）
#   3. 之后每次发版：改 packages/core/package.json 的 version → 推 tag → 跑本 workflow。

on:
  workflow_dispatch:
  release:
    types: [published]

# 同一时间只允许一个发布作业：并发触发会让后一个撞上 "cannot publish over" 而红。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC 必需：换取 npm 的短期发布凭据

jobs:
  publish:
    name: npm publish (OIDC)
    # 验收套件里有 4 条 Windows 专用断言（shell 检测的 win32 分支），仓库 CI 同样把 Linux 标为观察项。
    # 发布闸必须跑在必过平台上，否则会被这些用例挡住（2026-10-18 实测：ubuntu 上 Test suite 红）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing 需要 npm >= 11.5.1；Node 24 自带的 npm 可能刚好不够。
      # 2026-10-18：从 `npm@latest` 改为**锁大版本**——latest 每次可能带进新的 2FA/GAT 策略，
      # 发布日志会突然因为上游策略变化而红（本仓库已踩过两次）。锁 11 大版本，行为可预期。
      - name: Ensure npm >= 11.5.1
        run: |
          npm install -g npm@11
          npm --version
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);if(v[0]<11||(v[0]===11&&v[1]<5)){console.error('npm too old:',v.join('.'));process.exit(1)}"

      # 发布闸：跑**整条** `npm run check`（根目录），不是只跑测试。
      #
      # 2026-11-08 修：此前是 `npm test` + `working-directory: packages/core`，只跑
      # `tests/audit-isolation.mjs`（763 条测试，但**仅此一项**）。eval / eval:dsh / selftest /
      # bridges / privacy:gate / manifest:check / docs:lint / lint / smells / schema:verify
      # 全都不在发布路径上——测试绿而说明漂移、死链、结构异味超标，照样能发出去。
      # 判据：发布门必须与本地 `npm run check` **同一条命令**，否则"本地绿"不保证"发得出去"。
      - name: 发布闸（整条 check 链）
        run: npm run check

      # 幂等守卫（2026-11-17）：本 workflow 也由 `release: published` 触发，而给历史版本
      # 补建 Release 是正当操作。没有这道守卫，补建一次就红一次（npm 拒绝覆盖已发版本）。
      # 判据是 registry 里**这个版本**在不在，不是 latest 指向哪。
      - name: 版本已在 registry 则跳过发布
        id: guard
        shell: pwsh
        run: |
          # 为什么最后要显式 exit 0：Actions 的 pwsh 包装会在脚本末尾 `exit $LASTEXITCODE`，
          # 而 `npm view` 查不到版本时留下 1——脚本内容全对，步骤照样判失败。
          # 2026-11-17 首跑就是这么红的（v3.5.1 没发出去）；当时误判为 $ErrorActionPreference，
          # 改成 Continue 仍然红，才定位到这一行。「查不到」在本步是正常结果。
          $v = node -p "require('./packages/core/package.json').version"
          $existing = (npm view "focus-guard@$v" version 2>$null | Out-String).Trim()
          if ($existing -eq $v) {
            "skip=true"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Output "npm 已有 $v —— 本次只补 GitHub Release，不重发。"
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          exit 0

      - name: Publish
        if: steps.guard.outputs.skip != 'true'
        working-directory: packages/core
        run: npm publish --access public --provenance

      # Verify 原来只 print 不断言，且只等 5 秒。2026-11-17 实测：npm 打印 `+ focus-guard@3.5.0`
      # 之后 registry 还要过两三分钟处理流水线，那一步当时读到的是旧号 3.4.1，却照样算绿。
      # 现在轮询到出现为止（最多 4 分钟），查的是**这个版本**而不是 latest。
      - name: Verify
        shell: pwsh
        run: |
          # 同上：轮询的第一圈必然读不到（registry 还没处理完），`npm view` 留下 $LASTEXITCODE=1；
          # 成功分支必须自己 exit 0，失败分支自己 exit 1——别指望包装脚本替我们判。
          $ErrorActionPreference = 'Continue'
          $v = node -p "require('./packages/core/package.json').version"
          for ($i = 0; $i -lt 12; $i++) {
            $got = (npm view "focus-guard@$v" version 2>$null | Out-String).Trim()
            if ($got -eq $v) { Write-Output "registry 已有 focus-guard@$v"; exit 0 }
            Write-Output "等待中：第 $i 次未读到 $v（读到 '$got'）"
            Start-Sleep -Seconds 20
          }
          Write-Error "4 分钟内 registry 仍未出现 focus-guard@$v"
          exit 1
